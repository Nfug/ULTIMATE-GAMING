<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="STYLE.CSS" />
</head>
<body class="snake-page">
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
      <video class="loading-video" autoplay muted loop playsinline>
      <source src="ultimate gaming.mp4" type="video/mp4" />
      Your browser does not support the loading video.
      </video>
      <p>Loading...</p>
    </div>
  </div>

  <main class="game-shell">
    <div class="top-bar">
      <h1 class="title">Snake</h1>
      <div class="stats">
        <div class="chip">Score: <strong id="score">0</strong></div>
        <div class="chip">Best: <strong id="best">0</strong></div>
        <div class="chip" id="difficultyChip">🟢 Easy</div>
        <button id="startBtn" class="primary">🕹️ Start Game</button>
        <button class="secondary" onclick="goBack()">⬅ Back</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div id="overlay" class="overlay">
        <div>
          <h2>🎮 Ready to Play?</h2>
          <p style="font-size: 0.9rem;">🎯 Use arrow keys or WASD to move<br>🍎 Eat the food to grow<br>⚠️ Avoid walls and yourself<br><br>Choose your difficulty and let's go!</p>
        </div>
      </div>
      <div id="settingsOverlay" class="overlay hidden">
        <div>
          <h2 style="color: #5c70b3;">⚙️ Choose Your Challenge</h2>
          <p style="color: #89ada3; margin: 12px 0; font-size: 0.9rem;">Pick a difficulty level and test your reflexes!</p>
          <div class="settings">
            <div class="setting-item">
              <label for="difficultySlider">Difficulty Level</label>
              <input type="range" id="difficultySlider" min="1" max="5" value="1" step="1" />
              <div class="setting-value" id="difficultyValue">🟢 Easy</div>
            </div>
          </div>
          <div class="row">
            <button id="goBtn" class="primary">🚀 Let's Go!</button>
            <button id="settingsBackBtn" class="secondary">↩️ Back</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls" aria-label="Touch controls">
      <div class="row">
        <button data-dir="up">Up</button>
      </div>
      <div class="row">
        <button data-dir="left">Left</button>
        <button data-dir="down">Down</button>
        <button data-dir="right">Right</button>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlayEl = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const difficultySlider = document.getElementById("difficultySlider");
    const difficultyValue = document.getElementById("difficultyValue");
    const difficultyChip = document.getElementById("difficultyChip");
    const goBtn = document.getElementById("goBtn");
    const settingsBackBtn = document.getElementById("settingsBackBtn");

    const gridSize = 24;
    const tile = canvas.width / gridSize;
// Define difficulty levels
    const difficultyLevels = [
      { name: "Easy", tickMs: 190, emoji: "🟢" },
      { name: "Normal", tickMs: 150, emoji: "🟡" },
      { name: "Hard", tickMs: 120, emoji: "🔴" },
      { name: "Extreme", tickMs: 95, emoji: "⚫" },
      { name: "Insane", tickMs: 75, emoji: "💀" }
    ];
// Game state variables
    let currentDifficulty = 1;
    let currentTickMs = difficultyLevels[0].tickMs;
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let score = 0;
    let best = Number(localStorage.getItem("snakeBest") || 0);
    let timer = null;
    let running = false;
// Initialize best score display
    bestEl.textContent = String(best);
    updateDifficultyDisplay();
// Function to apply difficulty settings
    function applyDifficulty(value) {
      currentDifficulty = Number(value);
      currentTickMs = difficultyLevels[currentDifficulty - 1].tickMs;
      updateDifficultyDisplay();
    }
// Event listeners for difficulty slider
    difficultySlider.addEventListener("input", (e) => {
      applyDifficulty(e.target.value);
    });
// Change event to update difficulty when slider is released
    difficultySlider.addEventListener("change", (e) => {
      applyDifficulty(e.target.value);
    });
// Function to update difficulty display in settings and main chip
    function updateDifficultyDisplay() {
      const level = difficultyLevels[currentDifficulty - 1];
      difficultyValue.textContent = `${level.emoji} ${level.name}`;
      difficultyChip.textContent = `${level.emoji} ${level.name}`;
    }
// Functions to show/hide difficulty settings overlay
    function showDifficultySettings() {
      overlayEl.classList.add("hidden");
      settingsOverlay.classList.remove("hidden");
      difficultySlider.value = currentDifficulty;
      updateDifficultyDisplay();
    }
// Function to hide difficulty settings and return to main overlay
    function hideDifficultySettings() {
      settingsOverlay.classList.add("hidden");
      overlayEl.classList.remove("hidden");
    }
// Function to start the game
    function startGame() {
      applyDifficulty(difficultySlider.value);

      snake = [
        { x: 8, y: 12 },
        { x: 7, y: 12 },
        { x: 6, y: 12 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = "0";
      spawnFood();
      settingsOverlay.classList.add("hidden");
      overlayEl.classList.add("hidden");
      running = true;

      if (timer) clearInterval(timer);
      timer = setInterval(step, currentTickMs);
      draw();
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      timer = null;

      if (score > best) {
        best = score;
        localStorage.setItem("snakeBest", String(best));
        bestEl.textContent = String(best);
      }

      overlayEl.classList.remove("hidden");
      overlayEl.innerHTML = `
        <div>
          <h2 style="color: var(--danger);">🎮 Game Over</h2>
          <p style="font-size: 1.1rem; margin: 15px 0; color: #ffd700;">${message}</p>
          <p>🐉 Your Score: <strong>${score}</strong><br />🏅 Best Score: <strong>${best}</strong><br /><br />Ready for another round?</p>
        </div>
      `;
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        const x = Math.floor(Math.random() * gridSize);
        const y = Math.floor(Math.random() * gridSize);
        valid = !snake.some((part) => part.x === x && part.y === y);
        if (valid) {
          food = { x, y };
        }
      }
    }

    function step() {
      if (!running) return;

      dir = nextDir;
      const head = snake[0];
      const newHead = { x: head.x + dir.x, y: head.y + dir.y };

      const hitWall =
        newHead.x < 0 ||
        newHead.y < 0 ||
        newHead.x >= gridSize ||
        newHead.y >= gridSize;

      const hitSelf = snake.some((part) => part.x === newHead.x && part.y === newHead.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 1;
        scoreEl.textContent = String(score);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(148, 163, 184, 0.12)";
      ctx.lineWidth = 1;

      for (let i = 0; i <= gridSize; i += 1) {
        const p = i * tile;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function draw() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#0b1220");
      gradient.addColorStop(1, "#111827");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      ctx.fillStyle = "#fb923c";
      ctx.fillRect(food.x * tile, food.y * tile, tile, tile);

      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = "#4ade80";
        } else {
          ctx.fillStyle = "#22c55e";
        }
        ctx.fillRect(part.x * tile + 1, part.y * tile + 1, tile - 2, tile - 2);
      });
    }

    function setDirection(direction) {
      if (!running) return;

      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const proposed = map[direction];
      if (!proposed) return;

      const reversing = proposed.x === -dir.x && proposed.y === -dir.y;
      if (!reversing) {
        nextDir = proposed;
      }
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }

      if (key === "arrowup" || key === "w") setDirection("up");
      if (key === "arrowdown" || key === "s") setDirection("down");
      if (key === "arrowleft" || key === "a") setDirection("left");
      if (key === "arrowright" || key === "d") setDirection("right");
    });

    document.querySelectorAll("button[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => setDirection(btn.dataset.dir));
    });

    startBtn.addEventListener("click", () => {
      showDifficultySettings();
    });

    goBtn.addEventListener("click", () => {
      startGame();
    });

    settingsBackBtn.addEventListener("click", () => {
      hideDifficultySettings();
    });

    function goBack() {
      window.location.href = "GAME SELECTION.HTML";
    }

    draw();
  </script>
<script>
  window.addEventListener('load', function () {
    var loadingScreen = document.getElementById('loadingScreen');
    if (!loadingScreen) return;
    setTimeout(function () {
      loadingScreen.classList.add('hidden');
    }, 450);
  });
</script>
</body>
</html>
